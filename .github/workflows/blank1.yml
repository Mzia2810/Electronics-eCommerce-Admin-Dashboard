name: Build Push Deploy

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: electronicsecommerce.azurecr.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3


    # Show files (debug step)
    - name: Show repo structure
      run: |
        pwd
        ls -la


    # Login to Azure Container Registry
    - name: Login to ACR
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR_LOGIN_SERVER \
        --username ${{ secrets.ACR_USERNAME }} \
        --password-stdin


    # -----------------------------
    # BUILD BACKEND (server)
    # -----------------------------
    - name: Build Backend Docker Image
      run: |
        cd server
        npm install
        npx prisma generate
        docker build -t $ACR_LOGIN_SERVER/backend:latest .


    - name: Push Backend Image
      run: |
        docker push $ACR_LOGIN_SERVER/backend:latest


    # -----------------------------
    # BUILD FRONTEND (Next.js)
    # -----------------------------
    - name: Build Frontend Docker Image
      run: |
        npm install
        npm run build
        docker build -t $ACR_LOGIN_SERVER/frontend:latest .


    - name: Push Frontend Image
      run: |
        docker push $ACR_LOGIN_SERVER/frontend:latest


    # -----------------------------
    # DEPLOY BACKEND VM
    # -----------------------------
    - name: Deploy Backend VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.BACKEND_VM_IP }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker login electronicsecommerce.azurecr.io \
          -u ${{ secrets.ACR_USERNAME }} \
          -p ${{ secrets.ACR_PASSWORD }}

          docker pull electronicsecommerce.azurecr.io/backend:latest

          docker stop backend || true
          docker rm backend || true

          docker run -d \
          -p 3000:3000 \
          --name backend \
          --restart unless-stopped \
          electronicsecommerce.azurecr.io/backend:latest


    # -----------------------------
    # DEPLOY FRONTEND VM
    # -----------------------------
    - name: Deploy Frontend VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.FRONTEND_VM_IP }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker login electronicsecommerce.azurecr.io \
          -u ${{ secrets.ACR_USERNAME }} \
          -p ${{ secrets.ACR_PASSWORD }}

          docker pull electronicsecommerce.azurecr.io/frontend:latest

          docker stop frontend || true
          docker rm frontend || true

          docker run -d \
          -p 80:3000 \
          --name frontend \
          --restart unless-stopped \
          electronicsecommerce.azurecr.io/frontend:latest