name: Deploy Frontend to Windows IIS via SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      working-directory: .
      run: npm install

    - name: Build Next.js frontend
      working-directory: .
      run: npm run build

    - name: Deploy frontend to VM via SSH
      uses: appleboy/scp-action@v0.1.5
      with:
        host: ${{ secrets.FRONTEND_VM_IP }}
        username: ${{ secrets.FRONTEND_VM_USER }}
        key: ${{ secrets.FRONTEND_VM_KEY }}
        port: 22
        source: ".next/**,public/**,package.json,next.config.js"
        target: ${{ secrets.FRONTEND_IIS_PATH }}

    - name: Restart IIS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.FRONTEND_VM_IP }}
        username: ${{ secrets.FRONTEND_VM_USER }}
        key: ${{ secrets.FRONTEND_VM_KEY }}
        port: 22
        script: |
          iisreset
